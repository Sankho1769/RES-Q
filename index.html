<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>resQ — Emergency Care, Anytime</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
            handwritten: ['Caveat', 'cursive']
          },
          colors: {
            resqTeal: '#14C8D4',
            resqRed: '#FF2D55',
            resqDark: '#0D1E2C',
            resqLight: '#F5F7FA'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0D1E2C;
    }
    .scrollbar-hidden::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hidden {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(255, 45, 85, 0.4), 0 0 40px rgba(255, 45, 85, 0.15);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 35px rgba(255, 45, 85, 0.7), 0 0 55px rgba(255, 45, 85, 0.3);
        transform: scale(1.015);
      }
    }
    @keyframes heart-pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes signal-ring {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    .animate-float {
      animation: float 4s ease-in-out infinite;
    }
    .animate-pulse-glow {
      animation: pulse-glow 2.5s infinite ease-in-out;
    }
    .animate-heart-pulse {
      animation: heart-pulse 1.1s infinite ease-in-out;
    }
    .signal-ring {
      animation: signal-ring 2s infinite ease-out;
    }
    .glassmorphism {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-center py-0 sm:py-8 px-4">

  <div class="w-full max-w-[390px] h-[844px] bg-resqLight rounded-none sm:rounded-[48px] shadow-2xl overflow-hidden relative border-0 sm:border-[8px] border-slate-900 flex flex-col">
    
    <div class="bg-resqLight px-5 pt-3 pb-2 flex justify-between items-center text-slate-800 text-xs select-none z-30 font-semibold shrink-0">
      <span>9:41</span>
      <div class="w-24 h-4 bg-slate-950 absolute left-1/2 -translate-x-1/2 top-0 rounded-b-xl hidden sm:block"></div>
      <div class="flex items-center gap-1.5">
        <i class="fa-solid fa-signal text-[10px]"></i>
        <span>5G</span>
        <div class="w-5 h-3 border border-slate-800 rounded-sm relative flex items-center p-[1px] ml-0.5">
          <div class="h-full w-4/5 bg-slate-800 rounded-2xs"></div>
        </div>
      </div>
    </div>

    <header class="px-5 pt-4 pb-3 flex justify-between items-center relative z-20 shrink-0 bg-resqLight">
      <div class="flex items-center gap-3">
        <button onclick="toggleMenu()" class="w-10 h-10 rounded-xl bg-white border border-slate-100 flex items-center justify-center text-slate-700 shadow-sm hover:shadow-md active:scale-95 transition">
          <i class="fa-solid fa-bars-staggered text-sm"></i>
        </button>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="text-xl font-black text-resqTeal tracking-tight leading-none">resQ</span>
            <span class="inline-flex items-center gap-1 bg-emerald-500/10 text-emerald-500 font-extrabold text-[8px] px-2 py-0.5 rounded-full tracking-widest leading-none">
              <span class="w-1.2 h-1.2 bg-emerald-500 rounded-full animate-ping"></span> LIVE
            </span>
          </div>
          <p class="text-[9px] text-slate-400 font-bold tracking-wide mt-0.5">Emergency Care, Anytime</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="triggerAlertToast()" class="w-10 h-10 rounded-xl bg-white border border-slate-100 flex items-center justify-center text-slate-700 shadow-sm hover:shadow-md relative active:scale-95 transition">
          <i class="fa-regular fa-bell text-sm"></i>
          <span class="absolute top-3 right-3 w-1.5 h-1.5 bg-resqRed rounded-full"></span>
        </button>
        <div onclick="navigate('#/profile')" class="w-10 h-10 rounded-xl bg-white border border-slate-100 p-0.5 shadow-sm hover:shadow-md active:scale-95 transition cursor-pointer">
          <div class="w-full h-full rounded-lg bg-gradient-to-tr from-resqTeal to-blue-500 flex items-center justify-center text-white text-xs font-black">
            SD
          </div>
        </div>
      </div>
    </header>

    <div class="flex-grow overflow-y-auto scrollbar-hidden w-full h-full relative" id="app-view"></div>

    <div id="loading-overlay" class="absolute inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
      <div class="w-12 h-12 rounded-full border-4 border-resqTeal border-t-transparent animate-spin"></div>
    </div>

    <button id="floating-bot-btn" onclick="navigate('#/chatbot')" class="fixed sm:absolute bottom-28 right-5 w-12 h-12 rounded-full bg-gradient-to-tr from-resqTeal to-cyan-500 text-white flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all duration-300 z-40 animate-float border-2 border-white">
      <div class="relative">
        <i class="fa-solid fa-robot text-base"></i>
        <span class="absolute -top-0.5 -right-0.5 w-2 h-2 bg-emerald-500 rounded-full border border-white"></span>
      </div>
    </button>

    <div class="absolute bottom-5 inset-x-4 h-18 bg-white/85 backdrop-blur-xl border border-white rounded-[24px] py-1.5 px-4 flex justify-between items-center z-40 shadow-lg shrink-0">
      <button onclick="navigate('#/')" id="nav-btn-home" class="flex flex-col items-center gap-1 text-slate-400 transition duration-200 shrink-0">
        <i class="fa-solid fa-home text-base"></i>
        <span class="text-[8.5px] font-extrabold tracking-wider uppercase">Home</span>
      </button>

      <button onclick="navigate('#/bookings')" id="nav-btn-bookings" class="flex flex-col items-center gap-1 text-slate-400 transition duration-200 shrink-0">
        <i class="fa-solid fa-calendar-check text-base"></i>
        <span class="text-[8.5px] font-extrabold tracking-wider uppercase">Bookings</span>
      </button>

      <div class="relative -mt-9 shrink-0">
        <div class="absolute inset-0 bg-resqRed/20 rounded-full blur-xl scale-125 animate-pulse-soft"></div>
        <button onclick="navigate('#/ambulance-booking')" class="w-14 h-14 bg-gradient-to-tr from-resqRed to-red-600 rounded-full flex flex-col items-center justify-center text-white shadow-xl border-4 border-white active:scale-95 transition-all duration-300 relative z-10">
          <i class="fa-solid fa-triangle-exclamation text-base animate-bounce"></i>
          <span class="text-[8px] font-black tracking-widest uppercase leading-none mt-0.5">SOS</span>
        </button>
      </div>

      <button onclick="navigate('#/alerts')" id="nav-btn-alerts" class="flex flex-col items-center gap-1 text-slate-400 transition duration-200 shrink-0">
        <i class="fa-solid fa-bell text-base"></i>
        <span class="text-[8.5px] font-extrabold tracking-wider uppercase">Alerts</span>
      </button>

      <button onclick="navigate('#/profile')" id="nav-btn-profile" class="flex flex-col items-center gap-1 text-slate-400 transition duration-200 shrink-0">
        <i class="fa-solid fa-user-doctor text-base"></i>
        <span class="text-[8.5px] font-extrabold tracking-wider uppercase">Profile</span>
      </button>
    </div>

    <!-- BOTTOM SHEET: SIDEBAR DRAWER -->
    <div id="menu-drawer" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col justify-end hidden transition-all duration-300">
      <div class="bg-white rounded-t-[40px] p-6 space-y-5 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-100 pb-4">
          <h3 class="text-base font-black text-slate-950 flex items-center gap-2">
            <i class="fa-solid fa-layer-group text-resqTeal"></i> resQ Application Menu
          </h3>
          <button onclick="toggleMenu()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-900 transition">
            <i class="fa-solid fa-xmark text-xs"></i>
          </button>
        </div>
        <div class="space-y-3">
          <button onclick="navigate('#/')" class="w-full text-left p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold text-slate-800 flex items-center justify-between">
            <span>Primary Dashboard</span> <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="navigate('#/hospital-readiness')" class="w-full text-left p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold text-slate-800 flex items-center justify-between">
            <span>Hospital Bed Finder</span> <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
          <button onclick="navigate('#/blood-availability')" class="w-full text-left p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold text-slate-800 flex items-center justify-between">
            <span>Blood Inventory Registry</span> <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- BOTTOM SHEET: LOCATION SELECTOR -->
    <div id="location-drawer" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col justify-end hidden transition-all duration-300">
      <div class="bg-white rounded-t-[40px] p-6 space-y-5 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-100 pb-4">
          <h3 class="text-base font-black text-slate-950 flex items-center gap-2">
            <i class="fa-solid fa-location-crosshairs text-resqRed"></i> Select Area Sector
          </h3>
          <button onclick="toggleDrawer('location-drawer')" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-900 transition">
            <i class="fa-solid fa-xmark text-xs"></i>
          </button>
        </div>
        <div class="space-y-2 max-h-[300px] overflow-y-auto pr-1">
          <div onclick="selectDistrict('Salt Lake Sector V, Kolkata')" class="p-4 rounded-2xl border border-slate-100 hover:border-resqTeal/40 hover:bg-blue-50/20 cursor-pointer transition flex justify-between items-center group">
            <span class="text-xs font-bold text-slate-900 group-hover:text-resqTeal">Salt Lake Sector V</span>
            <span class="text-[10px] font-mono text-slate-400 font-semibold bg-slate-50 px-2 py-0.5 rounded">East Kolkata</span>
          </div>
          <div onclick="selectDistrict('New Town Action Area 1, Kolkata')" class="p-4 rounded-2xl border border-slate-100 hover:border-resqTeal/40 hover:bg-blue-50/20 cursor-pointer transition flex justify-between items-center group">
            <span class="text-xs font-bold text-slate-900 group-hover:text-resqTeal">New Town Action Area 1</span>
            <span class="text-[10px] font-mono text-slate-400 font-semibold bg-slate-50 px-2 py-0.5 rounded">East-North</span>
          </div>
          <div onclick="selectDistrict('Ballygunge Circular Rd, Kolkata')" class="p-4 rounded-2xl border border-slate-100 hover:border-resqTeal/40 hover:bg-blue-50/20 cursor-pointer transition flex justify-between items-center group">
            <span class="text-xs font-bold text-slate-900 group-hover:text-resqTeal">Ballygunge Circular Rd</span>
            <span class="text-[10px] font-mono text-slate-400 font-semibold bg-slate-50 px-2 py-0.5 rounded">South Kolkata</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="toast-notification" class="absolute top-14 left-4 right-4 bg-slate-900/95 backdrop-blur-md text-white border-l-4 border-resqTeal rounded-2xl p-4 shadow-xl z-50 transition-all duration-300 transform -translate-y-32 opacity-0 pointer-events-none flex gap-3.5 items-start">
    <div class="w-8 h-8 rounded-full bg-resqTeal/20 flex items-center justify-center shrink-0 mt-0.5">
      <i class="fa-solid fa-bell text-resqTeal"></i>
    </div>
    <div class="flex-1">
      <h5 id="toast-title" class="text-xs font-black uppercase tracking-widest text-resqTeal">ALERT CENTER</h5>
      <p id="toast-msg" class="text-xs text-slate-300 mt-0.5 font-medium leading-relaxed"></p>
    </div>
    <button onclick="dismissToast()" class="p-1 rounded-full hover:bg-white/10 text-slate-400 hover:text-white transition">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <script>
    const state = {
      user: {
        name: "Dr. Sourav Dutta",
        bloodGroup: "B+",
        location: "Salt Lake Sector V, Kolkata"
      },
      bookings: [
        { id: "RESQ-9801", date: "Today, 10:45 AM", type: "Emergency ALS Transport", pickup: "Salt Lake Sector V, Kolkata", dropoff: "SSKM Hospital (IPGMER)", status: "Active", crew: "ResQ Squad #18" },
        { id: "RESQ-3412", date: "Yesterday, 02:30 PM", type: "Health Shuttle", pickup: "New Town, Kolkata", dropoff: "Belle Vue Clinic", status: "Completed", crew: "ResQ Squad #04" }
      ],
      chatHistory: [
        { sender: "bot", text: "Hello! I am your resQ AI assistant. How can I help you today?" }
      ]
    };

    const routes = {
      '#/': renderHome,
      '#/ambulance-booking': renderAmbulanceBooking,
      '#/health-assessment': renderHealthAssessment,
      '#/blood-availability': renderBloodAvailability,
      '#/hospital-readiness': renderHospitalReadiness,
      '#/medical-records': renderMedicalRecords,
      '#/bookings': renderBookings,
      '#/alerts': renderAlerts,
      '#/profile': renderProfile,
      '#/chatbot': renderChatbot
    };

    function safeCreateIcons() {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      } else {
        setTimeout(safeCreateIcons, 50);
      }
    }

    function navigate(hash) {
      const loader = document.getElementById('loading-overlay');
      loader.classList.remove('hidden');
      setTimeout(() => loader.classList.remove('opacity-0'), 10);
      
      setTimeout(() => {
        window.location.hash = hash;
        loader.classList.add('opacity-0');
        setTimeout(() => loader.classList.add('hidden'), 300);
      }, 250);
    }

    function handleRouting() {
      const hash = window.location.hash || '#/';
      const viewContainer = document.getElementById('app-view');
      const renderFunc = routes[hash] || renderHome;

      updateBottomNav(hash);
      viewContainer.innerHTML = renderFunc();
      setTimeout(() => {
        safeCreateIcons();
      }, 50);
    }

    function updateBottomNav(hash) {
      const tabs = {
        '#/': 'home',
        '#/bookings': 'bookings',
        '#/alerts': 'alerts',
        '#/profile': 'profile'
      };
      
      Object.keys(tabs).forEach(route => {
        const id = `nav-btn-${tabs[route]}`;
        const elem = document.getElementById(id);
        if (elem) {
          if (hash === route) {
            elem.classList.remove('text-slate-400');
            elem.classList.add('text-resqTeal');
          } else {
            elem.classList.remove('text-resqTeal');
            elem.classList.add('text-slate-400');
          }
        }
      });
    }

    function renderHome() {
      return `
        <div class="px-5 pb-8 space-y-6">
          <div onclick="toggleDrawer('location-drawer')" class="inline-flex items-center gap-2.5 bg-white px-4.5 py-3 rounded-2xl text-xs font-bold text-slate-800 shadow-sm border border-slate-100 hover:border-resqTeal/30 active:scale-98 transition cursor-pointer mt-3">
            <i class="fa-solid fa-location-dot text-resqRed"></i>
            <span id="current-location-text">${state.user.location}</span>
            <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
          </div>

          <div class="w-full rounded-[28px] overflow-hidden bg-white shadow-sm border border-slate-100/50 relative group">
            <div class="absolute inset-0 bg-gradient-to-tr from-slate-900/60 to-transparent z-10 pointer-events-none"></div>
            <div class="absolute bottom-5 left-5 z-20 text-white">
              <h1 class="text-xl font-extrabold leading-tight">Help is just a tap away</h1>
              <p class="text-[10px] text-slate-200 mt-1 font-medium">We're here when you need us most</p>
            </div>
            <img src="Hero.png" alt="resQ emergency care" class="w-full h-auto object-cover rounded-[28px]" onerror="this.onerror=null; this.src='https://placehold.co/400x180/0d1e2c/14c8d4?text=resQ+Trauma+Support';">
          </div>

          <div onclick="navigate('#/ambulance-booking')" class="w-full bg-gradient-to-br from-[#FF2D55] via-[#E01C41] to-[#C21133] rounded-3xl p-5.5 text-white shadow-xl animate-pulse-glow cursor-pointer hover:scale-[1.01] transition duration-300 flex items-center justify-between relative overflow-hidden group">
            <div class="absolute -bottom-16 -right-16 w-44 h-44 bg-white/5 rounded-full pointer-events-none"></div>
            <div class="flex items-center gap-4 relative z-10">
              <div class="w-14 h-14 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center relative shrink-0">
                <span class="absolute inset-0 bg-white/20 rounded-full signal-ring"></span>
                <i class="fa-solid fa-truck-medical text-white text-xl animate-heart-pulse"></i>
              </div>
              <div>
                <span class="inline-block bg-white/20 text-white font-extrabold text-[8px] px-2 py-0.5 rounded-full tracking-widest uppercase mb-1.5">EMERGENCY</span>
                <h3 class="text-lg font-black tracking-tight leading-none">Request Ambulance Now</h3>
                <p class="text-[10px] text-white/85 font-semibold mt-1">We'll reach you in minutes</p>
              </div>
            </div>
            <div class="w-10 h-10 rounded-full bg-white text-resqRed flex items-center justify-center shadow-lg shrink-0">
              <i class="fa-solid fa-arrow-right text-base"></i>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between text-center">
            <div class="flex-1 flex flex-col items-center">
              <div class="w-9 h-9 rounded-full bg-blue-50 text-resqTeal flex items-center justify-center text-xs mb-1.5 shadow-inner"><i class="fa-solid fa-truck-front"></i></div>
              <span class="text-[11px] font-black text-slate-900 leading-none">120+</span>
              <span class="text-[7.5px] text-slate-400 font-bold tracking-tight mt-1 leading-tight uppercase">Ambulances</span>
            </div>
            <div class="w-px h-8 bg-slate-100 shrink-0"></div>
            <div class="flex-1 flex flex-col items-center">
              <div class="w-9 h-9 rounded-full bg-red-50 text-resqRed flex items-center justify-center text-xs mb-1.5 shadow-inner"><i class="fa-solid fa-headset"></i></div>
              <span class="text-[11px] font-black text-slate-900 leading-none">24/7</span>
              <span class="text-[7.5px] text-slate-400 font-bold tracking-tight mt-1 leading-tight uppercase">Support</span>
            </div>
            <div class="w-px h-8 bg-slate-100 shrink-0"></div>
            <div class="flex-1 flex flex-col items-center">
              <div class="w-9 h-9 rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center text-xs mb-1.5 shadow-inner"><i class="fa-solid fa-user-shield"></i></div>
              <span class="text-[11px] font-black text-slate-900 leading-none">100%</span>
              <span class="text-[7.5px] text-slate-400 font-bold tracking-tight mt-1 leading-tight uppercase">Verified</span>
            </div>
            <div class="w-px h-8 bg-slate-100 shrink-0"></div>
            <div class="flex-1 flex flex-col items-center">
              <div class="w-9 h-9 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center text-xs mb-1.5 shadow-inner"><i class="fa-solid fa-bolt"></i></div>
              <span class="text-[11px] font-black text-slate-900 leading-none">Instant</span>
              <span class="text-[7.5px] text-slate-400 font-bold tracking-tight mt-1 leading-tight uppercase">Response</span>
            </div>
          </div>

          <div class="space-y-4">
            <div class="flex justify-between items-center">
              <h4 class="text-sm font-extrabold text-slate-900 tracking-tight">Essential Services</h4>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div onclick="navigate('#/health-assessment')" class="bg-[#EAF9FA] border border-[#D5F3F5]/60 p-4.5 rounded-[24px] shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col justify-between h-[146px] relative group overflow-hidden">
                <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-resqTeal shadow-sm shrink-0">
                  <i class="fa-solid fa-heart-pulse text-sm"></i>
                </div>
                <div class="pr-6">
                  <h5 class="font-extrabold text-xs text-slate-900 leading-snug">Health Assessment</h5>
                  <p class="text-[9px] text-slate-400 mt-0.5 font-semibold leading-tight">Symptom checker</p>
                </div>
                <div class="absolute bottom-4.5 right-4.5 w-6.5 h-6.5 rounded-full bg-white text-slate-400 flex items-center justify-center shadow-sm border border-slate-100/50 group-hover:text-resqTeal group-hover:border-resqTeal transition duration-300">
                  <i class="fa-solid fa-arrow-right text-[8px]"></i>
                </div>
              </div>

              <div onclick="navigate('#/blood-availability')" class="bg-[#FFF0F2] border border-[#FFE0E4]/60 p-4.5 rounded-[24px] shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col justify-between h-[146px] relative group overflow-hidden">
                <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-resqRed shadow-sm shrink-0">
                  <i class="fa-solid fa-droplet text-sm"></i>
                </div>
                <div class="pr-6">
                  <h5 class="font-extrabold text-xs text-slate-900 leading-snug">Blood Availability</h5>
                  <p class="text-[9px] text-slate-400 mt-0.5 font-semibold leading-tight">Depot tracking</p>
                </div>
                <div class="absolute bottom-4.5 right-4.5 w-6.5 h-6.5 rounded-full bg-white text-slate-400 flex items-center justify-center shadow-sm border border-slate-100/50 group-hover:text-resqRed group-hover:border-resqRed transition duration-300">
                  <i class="fa-solid fa-arrow-right text-[8px]"></i>
                </div>
              </div>

          </div>

          <div class="bg-white border border-slate-100 rounded-3xl p-5 shadow-sm flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-resqTeal to-blue-500 text-white flex items-center justify-center font-black text-xl shadow-sm">
              SD
            </div>
            <div>
              <h4 class="font-extrabold text-slate-950">${state.user.name}</h4>
              <p class="text-xs text-slate-400 mt-0.5">Primary Blood Group: <span class="text-resqRed font-black">${state.user.bloodGroup}</span></p>
              <span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-500 font-bold text-[9px] px-2 py-0.5 rounded-full mt-2">
                Verified Account
              </span>
            </div>
          </div>

          <div class="space-y-3">
            <div class="bg-white p-4.5 rounded-2xl border border-slate-100 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-slate-50 text-slate-600 flex items-center justify-center"><i class="fa-solid fa-house-medical"></i></div>
                <span class="text-xs font-bold text-slate-800">Saved Addresses & Workplaces</span>
              </div>
              <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
            </div>

            <div class="bg-white p-4.5 rounded-2xl border border-slate-100 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-slate-50 text-slate-600 flex items-center justify-center"><i class="fa-solid fa-phone"></i></div>
                <span class="text-xs font-bold text-slate-800">Emergency Presets & Contacts</span>
              </div>
              <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
            </div>
          </div>
        </div>
      `;
    }

    function renderChatbot() {
      let chatHistoryHtml = "";
      state.chatHistory.forEach(ch => {
        const isBot = ch.sender === "bot";
        chatHistoryHtml += `
          <div class="flex ${isBot ? 'justify-start' : 'justify-end'}">
            <div class="max-w-[80%] rounded-2xl p-3.5 text-xs font-semibold leading-relaxed ${isBot ? 'bg-white text-slate-800 rounded-tl-none border border-slate-100 shadow-sm' : 'bg-resqTeal text-white rounded-tr-none'}">
              ${ch.text}
            </div>
          </div>
        `;
      });

      return `
        <div class="flex flex-col h-[700px] px-5 pb-8 justify-between relative">
          <div class="flex items-center gap-3 mt-4 shrink-0">
            <button onclick="navigate('#/')" class="w-9 h-9 rounded-xl bg-white flex items-center justify-center text-slate-700 shadow-sm"><i class="fa-solid fa-chevron-left"></i></button>
            <h2 class="text-lg font-black text-slate-900">AI Symptom Assistant</h2>
          </div>

          <div class="flex-grow overflow-y-auto scrollbar-hidden space-y-4 py-4" id="chat-thread">
            ${chatHistoryHtml}
          </div>

          <div class="shrink-0 bg-white border border-slate-100 rounded-2xl p-2 flex gap-2 items-center shadow-sm">
            <input type="text" id="chat-input" placeholder="Ask about symptoms..." class="flex-grow bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 text-xs text-slate-900 focus:outline-none">
            <button onclick="sendMessage()" class="w-10 h-10 rounded-xl bg-resqTeal text-white flex items-center justify-center shrink-0 active:scale-95 transition"><i class="fa-solid fa-paper-plane text-xs"></i></button>
          </div>
        </div>
      `;
    }

    function sendMessage() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;

      state.chatHistory.push({ sender: "user", text });
      input.value = "";

      const viewContainer = document.getElementById("app-view");
      viewContainer.innerHTML = renderChatbot();
      scrollChatToBottom();

      setTimeout(() => {
        let reply = "I've logged your query. If you feel severe discomfort, please trigger the SOS button instantly.";
        if (text.toLowerCase().includes("chest pain") || text.toLowerCase().includes("breath")) {
          reply = "Warning: These symptoms indicate high emergency priority. Please call 108 or trigger SOS dispatch right away.";
        }
        state.chatHistory.push({ sender: "bot", text: reply });
        viewContainer.innerHTML = renderChatbot();
        scrollChatToBottom();
      }, 1000);
    }

    function scrollChatToBottom() {
      const thread = document.getElementById("chat-thread");
      if (thread) {
        thread.scrollTop = thread.scrollHeight;
      }
    }

    function toggleDrawer(id) {
      const el = document.getElementById(id);
      if (el) {
        el.classList.toggle('hidden');
      }
    }

    function toggleMenu() {
      toggleDrawer('menu-drawer');
    }

    function selectDistrict(district) {
      state.user.location = district;
      showNotificationBanner("Sector Locked", `Target dispatch area shifted to ${district}.`);
      toggleDrawer('location-drawer');
      handleRouting();
    }

    function triggerAlertToast() {
      showNotificationBanner("Dispatch Sync", "Telemetry arrays are fully locked on Kolkata clinics.");
    }

    function showNotificationBanner(title, msg) {
      const toast = document.getElementById('toast-notification');
      document.getElementById('toast-title').innerText = title;
      document.getElementById('toast-msg').innerText = msg;

      toast.classList.remove('-translate-y-32', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(dismissToast, 4000);
    }

    function dismissToast() {
      const toast = document.getElementById('toast-notification');
      if (toast) {
        toast.classList.add('-translate-y-32', 'opacity-0', 'pointer-events-none');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }
    }

    window.addEventListener('hashchange', handleRouting);
    window.addEventListener('load', handleRouting);
  </script>
</body>
</html>
